plugins { id 'com.android.application' }
android {
    namespace 'com.abyss.usblink'
    compileSdk 35
    defaultConfig {
        applicationId 'com.abyss.usblink'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1-test'
    }
    buildTypes {
        debug {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
