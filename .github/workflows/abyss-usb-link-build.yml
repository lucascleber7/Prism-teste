name: Abyss USB Link - Android direct cable test APK
on:
  push:
    branches: [obs-poco-x7-pro-android-v1]
    paths:
      - 'usb-link/**'
      - '.github/workflows/abyss-usb-link-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
      - name: Install Android API 35
        run: |
          yes | sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0' || true
      - name: Build APK (debug/test)
        run: |
          set -euo pipefail
          gradle -p usb-link :app:assembleDebug --no-daemon --stacktrace
          test -s usb-link/app/build/outputs/apk/debug/app-debug.apk
      - name: Inspect APK package and SHA-256
        run: |
          set -euo pipefail
          APK=usb-link/app/build/outputs/apk/debug/app-debug.apk
          sha256sum "$APK"
          ls -lh "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 8
      - name: Upload installable Android test APK
        uses: actions/upload-artifact@v4
        with:
          name: AbyssUsbLink-0.1-Android-USB-no-tether
          path: usb-link/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
