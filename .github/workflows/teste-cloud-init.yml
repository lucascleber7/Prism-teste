# Roda o script de inicialização do Oracle (deploy/oracle-cloud-init.sh) como o primeiro boot faria, num
# Ubuntu 24.04 ARM com 2 núcleos visíveis, transmitindo para um receptor RTMP local (nada sai da máquina).
name: Teste do script de inicializacao (Oracle)
on:
  push:
    branches: [abyss-live-24h]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cloud-init:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Receptor RTMP local e script preenchido com valores de teste
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          IP=$(hostname -I | awk '{print $1}')
          echo "URL=rtmp://$IP:1935/live/chave_de_teste_ci" >> "$GITHUB_ENV"
          mkdir -p out
          sed -e "s|^TIKTOK_USER=.*|TIKTOK_USER='perfil_de_teste'|" \
              -e "s|^STREAM_URL=.*|STREAM_URL='rtmp://$IP:1935/live/chave_de_teste_ci'|" \
              deploy/oracle-cloud-init.sh > out/user-data.sh
          diff deploy/oracle-cloud-init.sh out/user-data.sh || true
      - name: Primeiro boot (root, 2 núcleos, DEMO para não conectar no TikTok)
        run: |
          ffmpeg -hide_banner -loglevel error -listen 1 -i "rtmp://0.0.0.0:1935/live/chave_de_teste_ci" -c copy -t 60 -y out/recebido.flv &
          sudo DEMO=1 taskset -c 0,1 bash out/user-data.sh
          echo "exit=$?"
          sleep 80
          wait || true
          sudo cat /var/log/abyss-live-setup.log | tail -30 > out/setup.log
          (cd /opt/abyss-live && sudo docker compose logs --no-color > "$GITHUB_WORKSPACE/out/container.log" 2>&1; sudo docker compose ps)
          ls -l /opt/abyss-live/.env | tee out/env-perm.txt
          sudo grep -E "^(WIDTH|HEIGHT|FPS|DEMO|TIKTOK_USER)=" /opt/abyss-live/.env | tee out/env-values.txt
      - name: Atualização automática (sem versão nova, e com versão nova)
        run: |
          sudo test -f /etc/cron.d/abyss-live && echo "cron instalado: $(sudo cat /etc/cron.d/abyss-live)"
          sudo bash /opt/abyss-live/deploy/atualizar.sh
          sudo grep -c "versão nova" /var/log/abyss-live-update.log 2>/dev/null | tee out/updates-before.txt || echo 0 > out/updates-before.txt
          echo 0000000000000000000000000000000000000000 | sudo tee /opt/abyss-live/.versao > /dev/null
          sudo bash /opt/abyss-live/deploy/atualizar.sh
          sudo cat /var/log/abyss-live-update.log | tee out/update.log
          sudo grep -c "^TIKTOK_USER=perfil_de_teste$" /opt/abyss-live/.env | tee out/env-kept.txt
          sleep 20
          (cd /opt/abyss-live && sudo docker compose ps --format '{{.State}}') | tee out/state-after-update.txt
      - name: Conferir
        run: |
          frames=$(ffprobe -v error -select_streams v -count_packets -show_entries stream=nb_read_packets -of csv=p=0 out/recebido.flv || echo 0)
          crashes=$(grep -c "navegador: parou" out/container.log || true)
          leaked=$(grep -c "chave_de_teste_ci" out/setup.log out/container.log | awk -F: '{s+=$2} END {print s}')
          {
            echo "### Script de inicialização em $(uname -m) / $(. /etc/os-release; echo $PRETTY_NAME)"
            echo "- quadros recebidos: $frames (esperado ~1800 em 60 s a 30 fps)"
            echo "- quedas do navegador: $crashes"
            echo "- chave aparecendo nos logs: $leaked"
            echo "- .env: $(cat out/env-perm.txt | awk '{print $1, $3}')"
            echo "- qualidade escolhida: $(tr '\n' ' ' < out/env-values.txt)"
            echo "- atualização sem versão nova não fez nada: $(cat out/updates-before.txt) troca(s)"
            echo "- atualização com versão nova: $(grep -c 'atualizado e religado' out/update.log) religada(s); @ mantido: $(cat out/env-kept.txt); estado: $(cat out/state-after-update.txt)"
            echo '```'; tail -6 out/setup.log; grep -E "frame=.*speed" out/container.log | tail -1; echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          grep -q "^0$" out/updates-before.txt
          grep -q "atualizado e religado" out/update.log
          grep -q "^1$" out/env-kept.txt
          grep -q "running" out/state-after-update.txt
          grep -q "live ligada" out/setup.log
          grep -q "^-rw------- .* root" out/env-perm.txt
          grep -q "^FPS=30$" out/env-values.txt
          test "$crashes" -eq 0 && test "$frames" -ge 1500 && test "$leaked" -eq 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: teste-cloud-init
          path: out/
